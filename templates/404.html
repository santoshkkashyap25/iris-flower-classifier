{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block head_extra %}
<style>
    .error-container {
        text-align: center;
        padding: 40px 10px;
    }

    .error-code {
        font-size: 5rem;
        font-weight: 800;
        color: #ef4444;
        line-height: 1;
        margin-bottom: 12px;
        letter-spacing: -0.04em;
    }

    .error-title {
        font-size: 1.6rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 12px;
    }

    .error-desc {
        color: var(--text-muted);
        font-size: 1.05rem;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .return-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 12px 26px;
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    .return-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Specimen Page Not Found</h1>
    <p class="error-desc">The page or resource you are searching for does not exist in this botanical database.</p>
    <a href="{{ url_for('home') }}" class="return-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Return to Predictor</span>
    </a>
</div>
{% endblock %}
